<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" font-family="'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="eq" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.6" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.5" stop-color="#ff2e63"/>
      <stop offset="1" stop-color="#00ff9c"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="836" height="146" rx="14" fill="#0d1117" stroke="url(#border)" stroke-width="2.5"/>

  <!-- spinning vinyl -->
  <g transform="translate(70 75)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <circle r="44" fill="#111"/>
      <circle r="38" fill="none" stroke="#222" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#222" stroke-width="2"/>
      <circle r="22" fill="none" stroke="#222" stroke-width="2"/>
      <circle r="14" fill="#ff2e63"/>
      <circle r="3" fill="#0d1117"/>
      <path d="M0 -44 A44 44 0 0 1 31 -31" stroke="#00ff9c" stroke-width="3" fill="none" opacity="0.8"/>
    </g>
  </g>

  <!-- labels -->
  <text x="140" y="42" font-size="15" fill="#00ff9c" filter="url(#glow)">&#9835; NOW PLAYING // SPOTIFY
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="140" y="68" font-size="12" fill="#8b949e">music keeps the code flowing...</text>

  <!-- equalizer bars -->
  <g fill="url(#eq)" filter="url(#glow)">
    <rect x="140" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="10;50;20;44;10" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="120;80;110;86;120" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="160" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="40;12;48;18;40" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="90;118;82;112;90" dur="0.7s" repeatCount="indefinite"/></rect>
    <rect x="180" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="20;48;14;40;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="110;82;116;90;110" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="200" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="46;16;38;10;46" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="84;114;92;120;84" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="220" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="14;44;22;50;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="116;86;108;80;116" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="240" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="36;10;46;20;36" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="94;120;84;110;94" dur="0.75s" repeatCount="indefinite"/></rect>
    <rect x="260" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="24;50;12;42;24" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="106;80;118;88;106" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="280" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="48;18;40;12;48" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="82;112;90;118;82" dur="0.85s" repeatCount="indefinite"/></rect>
    <rect x="300" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="12;42;24;48;12" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="118;88;106;82;118" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="320" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="38;14;46;22;38" dur="0.78s" repeatCount="indefinite"/><animate attributeName="y" values="92;116;84;108;92" dur="0.78s" repeatCount="indefinite"/></rect>
    <rect x="340" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="22;48;16;44;22" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="108;82;114;86;108" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="360" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="44;12;36;18;44" dur="0.88s" repeatCount="indefinite"/><animate attributeName="y" values="86;118;94;112;86" dur="0.88s" repeatCount="indefinite"/></rect>
    <rect x="380" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="16;46;26;50;16" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="114;84;104;80;114" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="400" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="34;10;42;20;34" dur="0.72s" repeatCount="indefinite"/><animate attributeName="y" values="96;120;88;110;96" dur="0.72s" repeatCount="indefinite"/></rect>
    <rect x="420" width="12" rx="3" y="80" height="50"><animate attributeName="height" values="26;50;14;40;26" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="104;80;116;90;104" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- progress bar -->
  <rect x="470" y="100" width="330" height="6" rx="3" fill="#161b22"/>
  <rect x="470" y="100" width="0" height="6" rx="3" fill="#00ff9c" filter="url(#glow)">
    <animate attributeName="width" from="0" to="330" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="470" y="90" font-size="12" fill="#8b949e">&#9654; live card below &#8595;</text>
  <text x="800" y="90" font-size="12" fill="#ff2e63" text-anchor="end">&#9724;&#9724; vol 100%</text>
</svg>
